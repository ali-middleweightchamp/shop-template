{% comment %}Плейсхолдер вместо битой картинки: иконка + первая буква категории.
Ожидает необязательную переменную `letter`.{% endcomment %}
<div class="flex h-full w-full flex-col items-center justify-center gap-1 bg-[#EFEEE9] text-muted">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.4" aria-hidden="true">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <circle cx="8.5" cy="9.5" r="1.5"/>
    <path d="M21 16l-5-5L5 20"/>
  </svg>
  {% if letter %}<span class="text-lg font-extrabold uppercase leading-none">{{ letter }}</span>{% endif %}
</div>
