{% comment %}Иконка доверительной плашки по ключу (ShopSettings.TrustIcon).
Параметры: key, size (классы, по умолчанию h-6 w-6).{% endcomment %}
<svg class="{{ size|default:'h-6 w-6' }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if key == 'truck' %}
  <path d="M3 6h11v9H3zM14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>
{% elif key == 'users' %}
  <circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 6.5a3 3 0 0 1 0 5.8M17 20a6.5 6.5 0 0 0-2-4.6"/>
{% elif key == 'calendar' %}
  <rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/>
{% elif key == 'box' %}
  <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>
{% elif key == 'shield' %}
  <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>
{% elif key == 'clock' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif key == 'percent' %}
  <path d="M19 5 5 19"/><circle cx="7.5" cy="7.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/>
{% elif key == 'star' %}
  <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.9 6.8 20.6l1-5.8-4.3-4.1 5.9-.9z"/>
{% elif key == 'wallet' %}
  <path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M16 12h4M16 10h5v4h-5a2 2 0 0 1 0-4z"/>
{% else %}{# tag — опт/розница, дефолт #}
  <path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/>
{% endif %}
</svg>
