{% load i18n %}
{% comment %}Кнопка «Назад»: возвращает в историю, а при прямом заходе — на главную.{% endcomment %}
<button type="button"
        onclick="if(history.length>1){history.back()}else{location.href='{% url 'catalog:home' %}'}"
        class="mb-3 inline-flex items-center gap-1.5 text-sm font-semibold text-muted transition hover:text-ink">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  {% trans "Назад" %}
</button>
