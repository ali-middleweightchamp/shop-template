{% extends "base.html" %}
{% load i18n l10n %}

{% block title %}{% trans "Корзина" %} · {{ shop.name }}{% endblock %}

{% block body %}
<div class="shell max-w-2xl pt-6"
     x-data="cartPage({
       min: {{ shop.min_order_amount|default:0|unlocalize }},
       currency: '{{ shop.currency_label|escapejs }}',
       header: '{{ shop.order_message_header|escapejs }}',
       tg: '{{ shop.telegram_username|escapejs }}',
       wa: '{{ shop.whatsapp_phone|escapejs }}',
       createUrl: '{% url 'catalog:order_create' %}'
     })">
  <h1 class="text-2xl font-extrabold tracking-tight text-ink">{% trans "Корзина" %}</h1>

  {# Пусто #}
  <template x-if="$store.cart.count === 0">
    <div class="mt-16 text-center">
      <p class="text-muted">{% trans "Корзина пуста." %}</p>
      <a href="{% url 'catalog:catalog' %}" class="btn-brand mt-4">{% trans "Перейти в каталог" %}</a>
    </div>
  </template>

  {# Список позиций #}
  <template x-if="$store.cart.count > 0">
    <div class="mt-6">
      <div class="divide-y divide-line rounded-card border border-line bg-surface">
        <template x-for="line in $store.cart.lines" :key="line.sku">
          <div class="flex items-center gap-3 p-3">
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-bold text-ink" x-text="line.name"></div>
              <div class="sku-tag mt-0.5" x-text="line.sku"></div>
            </div>
            <div class="stepper" :data-active="line.qty > 0">
              <button type="button" @click="$store.cart.dec(line.sku)" aria-label="−">−</button>
              <span class="qty" x-text="line.qty"></span>
              <button type="button" @click="$store.cart.inc(line.sku)" aria-label="+">+</button>
            </div>
            <div class="nums w-24 text-right text-sm font-bold text-ink">
              <span x-text="formatMoney(line.qty * line.price)"></span>
            </div>
            <button type="button" @click="$store.cart.remove(line.sku)" class="text-muted hover:text-ink" aria-label="{% trans 'Удалить' %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </template>
      </div>

      {# Комментарий #}
      <label class="mt-4 block">
        <span class="text-sm font-semibold text-ink">{% trans "Комментарий к заказу" %}</span>
        <textarea x-model="comment" rows="2" placeholder="{% trans 'Адрес, удобное время доставки…' %}"
                  class="mt-1 w-full rounded-control border border-line bg-surface p-3 text-sm focus:border-brand"></textarea>
      </label>

      {# Итого #}
      <div class="mt-4 flex items-center justify-between border-t border-line pt-4">
        <span class="text-sm font-semibold text-muted">{% trans "Итого" %}</span>
        <span class="nums text-2xl font-extrabold text-ink">
          <span x-text="formatMoney($store.cart.total)"></span> {{ shop.currency_label }}
        </span>
      </div>

      {# Минимальная сумма #}
      <template x-if="min > 0 && $store.cart.total < min">
        <div class="mt-3 rounded-control border border-line bg-paper p-3 text-sm text-muted">
          {% trans "Минимальная сумма заказа" %}:
          <span class="nums font-bold text-ink" x-text="formatMoney(min)"></span> {{ shop.currency_label }}.
          {% trans "Добавьте ещё товаров." %}
        </div>
      </template>

      {# Кнопки заказа #}
      <div class="mt-5 grid gap-2 sm:grid-cols-2">
        <button type="button" @click="orderTelegram()" :disabled="min > 0 && $store.cart.total < min"
                class="btn-brand" x-show="tg">{% trans "Заказать через Telegram" %}</button>
        <button type="button" @click="orderWhatsApp()" :disabled="min > 0 && $store.cart.total < min"
                class="btn-ghost" x-show="wa">{% trans "Заказать через WhatsApp" %}</button>
      </div>
    </div>
  </template>
</div>

<script>
  // Формирование заказа. Длинные заказы (текст > лимита) сохраняются в ShortOrder,
  // отправляется сокращённый вариант со ссылкой на полный состав.
  const ORDER_TEXT_LIMIT = 1500; // совпадает с ORDER_TEXT_LIMIT на сервере

  function getCookie(name) {
    const m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return m ? m.pop() : "";
  }

  function cartPage(cfg) {
    return {
      ...cfg,
      comment: "",
      sending: false,

      line(l) {
        return `${l.name} (${l.sku}) — ${l.qty} ${l.unit} × ${formatMoney(l.price)} = ${formatMoney(l.qty * l.price)}`;
      },
      // Полный текст заказа
      fullText() {
        const c = Alpine.store("cart");
        let t = this.header + "\n\n" + c.lines.map((l) => this.line(l)).join("\n");
        t += `\n\nИтого: ${formatMoney(c.total)} ${this.currency}`;
        if (this.comment.trim()) t += `\n\nКомментарий: ${this.comment.trim()}`;
        return t;
      },
      // Сокращённый текст: первые 10 позиций + код + ссылка на полный состав
      shortText(code, url) {
        const c = Alpine.store("cart");
        const head = c.lines.slice(0, 10).map((l) => this.line(l)).join("\n");
        const rest = c.lines.length - 10;
        let t = this.header + "\n\n" + head;
        if (rest > 0) t += `\n…и ещё ${rest} позиц.`;
        t += `\n\nИтого: ${formatMoney(c.total)} ${this.currency}`;
        t += `\nКод заказа: ${code}\nПолный список: ${url}`;
        if (this.comment.trim()) t += `\n\nКомментарий: ${this.comment.trim()}`;
        return t;
      },
      // Возвращает текст для отправки (полный или сокращённый со ссылкой)
      async buildMessage() {
        const full = this.fullText();
        if (encodeURIComponent(full).length <= ORDER_TEXT_LIMIT) return full;
        // Длинный заказ — сохраняем и берём короткий вариант
        const c = Alpine.store("cart");
        const resp = await fetch(this.createUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
          body: JSON.stringify({
            header: this.header, currency: this.currency, comment: this.comment,
            total: c.total, lines: c.lines,
          }),
        });
        if (!resp.ok) return full; // не удалось сохранить — шлём как есть
        const data = await resp.json();
        const url = window.location.origin + data.url;
        return this.shortText(data.code, url);
      },
      async send(base) {
        if (this.sending) return;
        this.sending = true;
        try {
          const text = await this.buildMessage();
          window.location.href = base + encodeURIComponent(text);
        } finally {
          this.sending = false;
        }
      },
      orderTelegram() { this.send(`https://t.me/${this.tg}?text=`); },
      orderWhatsApp() { this.send(`https://wa.me/${this.wa}?text=`); },
    };
  }
</script>
{% endblock %}
