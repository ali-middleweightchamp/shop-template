{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Избранное" %} · {{ shop.name }}{% endblock %}

{% block body %}
<div class="shell pt-6" x-data>
  {% include "catalog/partials/_backlink.html" %}
  <h1 class="font-display text-3xl font-extrabold tracking-tight text-ink">{% trans "Избранное" %}</h1>

  {# Пусто #}
  <template x-if="$store.fav.count === 0">
    <div class="flex flex-col items-center py-16 text-center">
      <div class="flex h-20 w-20 items-center justify-center rounded-2xl bg-sunken text-muted">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div class="mt-5 font-display text-xl font-extrabold text-ink">{% trans "В избранном пусто" %}</div>
      <p class="mt-1 text-muted">{% trans "Нажимайте на сердечко у товара" %}</p>
      <a href="{% url 'catalog:catalog' %}" class="btn-brand mt-6 rounded-xl px-6">{% trans "Перейти в каталог" %}</a>
    </div>
  </template>

  {# Список #}
  <template x-if="$store.fav.count > 0">
    <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 lg:grid-cols-4">
      <template x-for="f in $store.fav.lines" :key="f.sku">
        <article class="pcard" :class="!f.in_stock && 'is-out'">
          <div class="pcard-media">
            <button type="button" @click.prevent="$store.fav.remove(f.sku)" class="fav-btn is-fav absolute right-2.5 top-2.5 z-10" aria-label="{% trans 'Убрать из избранного' %}">
              <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
            <a :href="f.url" class="block h-full w-full">
              <template x-if="f.image"><img :src="f.image" class="h-full w-full object-contain"></template>
              <template x-if="!f.image"><div class="flex h-full w-full items-center justify-center text-line"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/></svg></div></template>
            </a>
          </div>
          <div class="flex flex-1 flex-col p-3">
            <a :href="f.url" class="product-title text-sm font-bold text-ink hover:text-accent" x-text="f.name"></a>
            <div class="mt-auto pt-3">
              <div class="nums mb-2.5 flex items-end gap-1.5">
                <span class="text-xl font-extrabold leading-none text-ink" x-text="formatMoney(f.price)"></span>
                <span class="text-xs text-muted">{{ shop.currency_label }}/<span x-text="f.unit"></span></span>
              </div>
              <template x-if="f.in_stock">
                <div>
                  <button type="button" x-show="$store.cart.qty(f.sku) === 0" @click="$store.cart.add(f)" class="pcard-add">{% trans "В корзину" %}</button>
                  <div x-show="$store.cart.qty(f.sku) > 0" x-cloak class="qty-row">
                    <button type="button" @click="$store.cart.dec(f.sku)" aria-label="−">−</button>
                    <span class="qv" x-text="$store.cart.qty(f.sku)">0</span>
                    <button type="button" @click="$store.cart.inc(f.sku)" aria-label="+">+</button>
                  </div>
                </div>
              </template>
              <template x-if="!f.in_stock">
                <div class="rounded-xl border border-line bg-sunken py-2.5 text-center text-xs font-semibold text-muted">{% trans "Нет в наличии" %}</div>
              </template>
            </div>
          </div>
        </article>
      </template>
    </div>
  </template>
</div>
{% endblock %}
