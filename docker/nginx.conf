upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Загрузка прайсов может быть увесистой
    client_max_body_size 20M;

    # Статику и медиа отдаёт nginx напрямую, не трогая Django
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django в проде смотрит на этот заголовок для SECURE_SSL_REDIRECT
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
